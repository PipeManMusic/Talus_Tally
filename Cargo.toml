[workspace]
resolver = "2"
members = [
    "crates/talus-core",
    "crates/talus-storage",
    "crates/talus-bin-bench",
]

# We deliberately exclude the existing Tauri Rust app at
# frontend/src-tauri so the legacy desktop build remains untouched
# during Phase 1. It joins this workspace in Phase 2b.
exclude = [
    "frontend/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/PipeManMusic/Talus_Tally"
authors = ["Talus Tally Dev"]

[workspace.dependencies]
# Pinned shared versions used across crates.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"

# Test-only
proptest = "1"
insta = { version = "1", features = ["json", "yaml"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
